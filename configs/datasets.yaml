    notes: |
      Google Drive 폴더 호스팅이라 curl로 직접 받기 어렵다. gdown 등 별도 도구 필요.
      전체를 받지 않는다. 구조: ecar/{short,evaluation,benign}, ecar-bro/{동일}, bro/(날짜별).
