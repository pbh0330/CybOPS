# 데이터셋 로컬 경로와 취득 정보
# 원본 파일은 저장소에 커밋하지 않는다. 이 파일만 커밋한다. (ADR-0010)
# 수명주기 절차: docs/05-data-lifecycle.md

roots:
  # F: 는 내장 고정 디스크 (931GB, 여유 923GB). 대용량 원본 보관용.
  raw: 'F:\mc-cycop-data\raw'
  interim: 'F:\mc-cycop-data\interim'
  # 파생물은 영구 자산이다. 백업 대상이며 어떤 정리 스크립트도 건드리지 않는다.
  processed: 'F:\mc-cycop-data\processed'

datasets:

  ait-lds-v2:
    priority: 1
    status: acquiring          # not-acquired | acquiring | acquired | distilled | verified | purged
    source: 'https://zenodo.org/records/5789064'
    doi: '10.5281/zenodo.5789064'
    published: '2022-02-24'
    license: 'CC BY-NC-SA 4.0'
    redistributable: 'attribution + non-commercial + share-alike 조건 하에서만'
    auth_required: false
    url_pattern: 'https://zenodo.org/records/5789064/files/{file}?download=1'
    total_compressed_gb: 130.6
    # 테스트베드 단위 부분 취득이 가능하다. 작은 것부터 받아 파이프라인을 검증한다.
    parts:
      - {file: 'russellmitchell.zip', gb: 7.1,  unpacked_gb: 14, status: acquiring}
      - {file: 'santos.zip',          gb: 10.0, unpacked_gb: 17, status: not-acquired}
      - {file: 'fox.zip',             gb: 15.8, unpacked_gb: 26, status: not-acquired}
      - {file: 'harrison.zip',        gb: 16.8, unpacked_gb: 27, status: not-acquired}
      - {file: 'wardbeck.zip',        gb: 17.2, unpacked_gb: 26, status: not-acquired}
      - {file: 'shaw.zip',            gb: 17.6, unpacked_gb: 27, status: not-acquired}
      - {file: 'wheeler.zip',         gb: 19.6, unpacked_gb: 30, status: not-acquired}
      - {file: 'wilson.zip',          gb: 26.5, unpacked_gb: 39, status: not-acquired}

  lanl-cyber1:
    priority: 2
    status: acquiring-manual   # 2026-09-05 사용자가 브라우저로 직접 취득 중
    landing_zone: 'C:\Users\qwert\Downloads'   # 완료 후 raw/lanl-cyber1 로 이동 필요
    acquired_parts:
      - {file: 'redteam.txt.gz', bytes: 4846, verified: 'gzip magic 1F 8B 확인', status: acquired}
    source: 'https://csr.lanl.gov/data/cyber1/'
    license: 'CC0 (퍼블릭 도메인)'   # 재배포 제약 없음 - 논문 부록 활용 여지가 가장 큼
    redistributable: true
    auth_required: true
    # 직접 다운로드 URL이 없다. 이메일과 사용 목적을 폼으로 제출해야 접근 권한이 나온다.
    # 사용자가 직접 신청해야 하는 항목.
    blocked_reason: 'csr.lanl.gov 폼 제출 필요 (이메일 + 사용 목적)'
    contact: 'cyberdata@lanl.gov'
    total_compressed_gb: 10.7
    parts:
      - {file: 'auth.txt.gz',    size: '7.2G'}
      - {file: 'proc.txt.gz',    size: '2.2G'}
      - {file: 'flows.txt.gz',   size: '1.1G'}
      - {file: 'dns.txt.gz',     size: '177M'}
      - {file: 'redteam.txt.gz', size: '4.8K'}   # 그라운드트루스

  darpa-tc:
    priority: 3
    status: not-acquired
    source: 'https://github.com/darpa-i2o/Transparent-Computing'
    license: 'TBD - 취득 시 확인'
    auth_required: false
    notes: 'Google Drive 호스팅. 서브셋(CADETS/THEIA/TRACE/FiveDirections) 단위 취득.
            각 캠페인에 ATT&CK 단계 정렬 그라운드트루스 매니페스트 포함.'

  darpa-optc:
    priority: 1                # ADR-0012 전술망 확정으로 1순위. docs/01-datasets.md 표 기준
    status: planned            # 그라운드트루스만 취득. 본 데이터 계획 확정, 미착수
    source: 'https://github.com/FiveDirections/OpTC-data'
    hosting: 'Google Drive - https://drive.google.com/drive/u/0/folders/1n3kkS3KR31KUegn42yk3-e6JkZvf0Caa'
    drive_root_folder_id: '1n3kkS3KR31KUegn42yk3-e6JkZvf0Caa'
    license: 'Public domain (US Government). Distribution A: approved for public release, distribution unlimited.'
    redistributable: true      # 제약 없음. LANL(CC0)과 함께 논문 부록 후보
    auth_required: false
    total_compressed_gb: 1000     # 약 1TB. 17억+ 이벤트.
    # 최소 취득 세트 실측 (2026-09-06). 파일 목록과 바이트 수는 매니페스트에 있다.
    manifest: 'configs/manifests/optc.json'
    fetch_script: 'scripts/fetch-optc.ps1'
    minimal_set_gb: 232.10
    minimal_set_files: 1001
    url_pattern: 'https://drive.usercontent.google.com/download?id={drive_id}&export=download&confirm=t'
    phases:
      - {n: 1, subset: 'ecar-bro/evaluation (all)',        files: 80,  gb: 0.61,  status: planned}
      - {n: 2, subset: 'ecar/evaluation/23Sep19-red',      files: 25,  gb: 33.48, status: planned}
      - {n: 3, subset: 'ecar/evaluation/25Sept',           files: 26,  gb: 26.36, status: planned}
      - {n: 4, subset: 'ecar/evaluation/24Sep19',          files: 42,  gb: 95.54, status: planned}
      - {n: 5, subset: 'ecar/evaluation/23Sep-night(+N)',  files: 32,  gb: 68.90, status: planned}
      - {n: 6, subset: 'bro/2019-09-23..25',               files: 796, gb: 7.21,  status: planned}
    notes: |
      전체를 받지 않는다. 구조: ecar/{short,evaluation,benign}, ecar-bro/{동일}, bro/(날짜별).
      그라운드트루스: OpTCRedTeamGroundTruth.pdf (취득·구조화 완료 → analysis/optc/)
      errata.md를 반드시 먼저 읽을 것 (데이터 이슈 4건).
      2026-09-06 실측으로 두 가지가 뒤집혔다:
        1) eCAR 파일은 호스트 단위가 아니라 25대씩 묶인 AIA-N-M 번들 단위다.
           레드팀 호스트 30개는 20개 번들 중 18개에 흩어져 있어 6%가 아니라 90%를 받게 된다.
           용량을 줄이는 축은 호스트가 아니라 일자다.
        2) gdown은 필요 없다. drive.usercontent.google.com/download?...&confirm=t 가
           Range 요청에 206으로 답해 curl -C - 이어받기가 그대로 된다.
      수집 공간 제약으로 1,000대가 아닌 500대 호스트분만 수집됐다 (README 원문 확인 완료).
      논문에 1,000을 인용하면 안 된다.

  security-datasets:
    priority: 보조
    status: not-acquired
    source: 'https://github.com/OTRF/Security-Datasets'
    notes: '소용량. ATT&CK 기법 단위 스모크 테스트 입력. 상시 보관 가능.'
