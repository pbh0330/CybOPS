# MC-CyCOP hosted bundle - nginx example. ASCII only.
#
# Two things are being served here and they have different risk profiles.
#
#   /            the static bundle. Public, read only, harmless.
#   /api/llm/    a reverse proxy to Ollama. This is someone's GPU.
#
# THE SHARP EDGE
#
# Ollama has no authentication of its own. Its API is not just inference: it
# also has /api/pull, /api/create, /api/copy, /api/delete and /api/push. A
# naive `proxy_pass http://127.0.0.1:11434/;` under /api/llm/ therefore hands
# every visitor the ability to make the server download arbitrary models,
# overwrite them, or delete them. The inference cost is the obvious problem;
# model management is the one that ruins the machine.
#
# So this config allows exactly one method on exactly one upstream path and
# denies the rest, rather than allowing everything and blocking a deny list.
# A deny list here would be wrong the next time Ollama adds an endpoint.

limit_req_zone  $binary_remote_addr zone=llm_req:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=llm_conn:10m;

server {
    listen 443 ssl;
    server_name mc-cycop.example.ac.kr;

    ssl_certificate     /etc/letsencrypt/live/mc-cycop.example.ac.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc-cycop.example.ac.kr/privkey.pem;

    root /srv/mc-cycop;
    index index.html;

    # The bundle. config.json must be the hosted one - see
    # scripts/Test-BundleConfig.ps1, which is the deploy gate for exactly that.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.json changes without a rebuild, so it must not be cached hard.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # ---- the model, if this deployment has one at all ---------------------
    #
    # Delete this whole block for the `off` posture. That is the default
    # recommendation in docs/21-deployment.md: the only thing it removes from
    # the screen is the live LLM attacker.

    location = /api/llm/api/chat {
        # The client uses /api/chat (staff-llm.mjs, attack-llm.mjs). /api/generate
        # is not used and is therefore not allowed - see Test-ProxyAllowlist.ps1.

        # 1. who. Ollama itself has no auth, so it has to live here.
        auth_basic           "MC-CyCOP model";
        auth_basic_user_file /etc/nginx/mc-cycop.htpasswd;

        # 2. how often. One wargame turn is one call, and a human plays turns
        # at human speed. 6 per minute with a burst of 2 is generous for that
        # and useless as a free inference API.
        limit_req  zone=llm_req burst=2 nodelay;
        limit_conn llm_conn 2;

        # 3. what. POST only, and only this one upstream path.
        limit_except POST { deny all; }

        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:11434/api/chat;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }

    location = /api/llm/api/tags {
        # config.js probes this at startup to decide whether to offer the LLM
        # option at all. Read only, so the rate limit is the whole control.
        auth_basic           "MC-CyCOP model";
        auth_basic_user_file /etc/nginx/mc-cycop.htpasswd;
        limit_req zone=llm_req burst=4 nodelay;
        proxy_pass http://127.0.0.1:11434/api/tags;
    }

    # Everything else under /api/llm/ is refused, including anything Ollama
    # gains in a future version.
    location /api/llm/ {
        return 403;
    }
}
